  <div class="wrap">
    <a class="logo" href="index.html"><span class="logo-icon" aria-hidden="true"><svg viewBox="0 0 64 64" width="26" height="26" fill="none"><rect x="2" y="2" width="60" height="60" rx="16" fill="#24399C"/><path d="M24 19 L18.5 19 L18.5 45 L24 45" stroke="#F7F8FB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 19 L45.5 19 L45.5 45 L40 45" stroke="#F7F8FB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24.5 33.5 L29.5 39 L40 25.5" stroke="#35D399" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="logo-accent">ATS</span> Resume Checker</a>

<div class="wrap auth-shell">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Free — 3 resume analyses a day, no card required.</p>

    <div class="form-error" id="form-error"></div>

    <div class="google-btn-container" id="google-signin-container"></div>
    <div class="auth-divider">or</div>

    <form id="signup-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">Create account</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = "app.html";

  async function handleGoogleCredential(idToken) {
    const errorBox = document.getElementById("form-error");
    errorBox.classList.remove("show");
    try {
      const data = await apiFetch("/api/auth/google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: idToken }),
      });
      Auth.setSession(data.token, data.email, data.plan);
      window.location.href = "app.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
    }
  }
  window.addEventListener("load", () => {
    initGoogleSignIn("google-signin-container", handleGoogleCredential);
  });

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("form-error");
    const btn = document.getElementById("submit-btn");
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Creating account…";

    try {
      const data = await apiFetch("/api/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      Auth.setSession(data.token, data.email, data.plan);
      window.location.href = "app.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Create account";
    }
  });
</script>

</body>
