<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html"><span class="logo-icon" aria-hidden="true"><svg viewBox="0 0 64 64" width="26" height="26" fill="none"><rect x="2" y="2" width="60" height="60" rx="16" fill="#24399C"/><path d="M24 19 L18.5 19 L18.5 45 L24 45" stroke="#F7F8FB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 19 L45.5 19 L45.5 45 L40 45" stroke="#F7F8FB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24.5 33.5 L29.5 39 L40 25.5" stroke="#35D399" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="logo-accent">ATS</span> Resume Checker</a>
    <nav class="primary">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="features.html">Features</a>
        <a href="pricing.html">Pricing</a>
        <a href="privacy.html">Privacy</a>
        <a href="contact.html">Contact</a>
      </div>
      <span id="nav-auth-slot"></span>
    </nav>
  </div>
</header>

<div class="wrap auth-shell">
  <div class="auth-card" id="card-missing-token" style="display:none;">
    <h1>Invalid reset link</h1>
    <p class="sub">This link is missing its reset token. Request a new one below.</p>
    <a class="btn btn-primary" style="width:100%; text-align:center; display:block;" href="forgot-password.html">Request a new link</a>
  </div>

  <div class="auth-card" id="card-form">
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <div class="form-error" id="form-error"></div>
    <div class="form-success" id="form-success"></div>

    <form id="reset-form">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password-confirm">Confirm new password</label>
        <input type="password" id="password-confirm" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">Reset password</button>
    </form>

    <div class="auth-switch"><a href="login.html">Back to log in</a></div>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get("token") || "";

  if (!token) {
    document.getElementById("card-missing-token").style.display = "block";
    document.getElementById("card-form").style.display = "none";
  }

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("form-error");
    const successBox = document.getElementById("form-success");
    const btn = document.getElementById("submit-btn");
    const form = document.getElementById("reset-form");
    errorBox.classList.remove("show");

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("password-confirm").value;
    if (password !== confirm) {
      errorBox.textContent = "Those passwords don't match.";
      errorBox.classList.add("show");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Resetting…";

    try {
      const data = await apiFetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: password }),
      });
      successBox.textContent = data.message + " Redirecting to login…";
      successBox.classList.add("show");
      form.style.display = "none";
      setTimeout(() => { window.location.href = "login.html"; }, 1800);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Reset password";
    }
  });
</script>

</body>
</html>
