[build]
  publish = "."
  command = ""

# Never cache HTML -- always fetch the latest page
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Short cache for CSS/JS since filenames aren't hashed -- keeps deploys
# reflecting quickly instead of users seeing yesterday's assets.css
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
