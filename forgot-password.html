<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html"><span class="logo-icon" aria-hidden="true"><svg viewBox="0 0 64 64" width="26" height="26" fill="none"><rect x="2" y="2" width="60" height="60" rx="16" fill="#24399C"/><path d="M24 19 L18.5 19 L18.5 45 L24 45" stroke="#F7F8FB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 19 L45.5 19 L45.5 45 L40 45" stroke="#F7F8FB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24.5 33.5 L29.5 39 L40 25.5" stroke="#35D399" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="logo-accent">ATS</span> Resume Checker</a>
    <nav class="primary">

        <a href="index.html">Home</a>

        <a href="contact.html">Contact</a>
      </div>
      <span id="nav-auth-slot"></span>
    </nav>
  </div>
</header>

<div class="wrap auth-shell">
  <div class="auth-card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your email and we'll send you a link to reset it.</p>

    <div class="form-error" id="form-error"></div>
    <div class="form-success" id="form-success"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">Send reset link</button>
    </form>

    <div class="auth-switch"><a href="login.html">Back to log in</a></div>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
  document.getElementById("forgot-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("form-error");
    const successBox = document.getElementById("form-success");
    const btn = document.getElementById("submit-btn");
    const form = document.getElementById("forgot-form");
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Sending…";

    try {
      const data = await apiFetch("/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value }),
      });
      // Deliberately generic message (whether or not the email has an
      // account) -- the backend never reveals which emails are registered.
      successBox.textContent = data.message;
      successBox.classList.add("show");
      form.style.display = "none";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Send reset link";
    }
  });
</script>

</body>
</html>
