<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#F7F8FB"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- faint bracket watermark, echoes the mark -->
  <path d="M120 140 L70 140 L70 490 L120 490" stroke="#E3E6EF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1080 140 L1130 140 L1130 490 L1080 490" stroke="#E3E6EF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- icon mark -->
  <g transform="translate(430,145)">
    <rect x="2" y="2" width="140" height="140" rx="34" fill="#24399C"/>
    <path d="M54 42 L40 42 L40 102 L54 102" stroke="#F7F8FB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 42 L104 42 L104 102 L90 102" stroke="#F7F8FB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 75 L67 88 L90 58" stroke="#35D399" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="600" y="365" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="54" fill="#13182B">
    <tspan fill="#3454D1">ATS</tspan> Resume Checker
  </text>
  <text x="600" y="410" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-weight="500" font-size="24" fill="#5B6478">
    Know exactly why you're not getting interviews — and fix it
  </text>

  <defs>
    <radialGradient id="bgGrad" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#EEF1FC"/>
      <stop offset="1" stop-color="#F7F8FB"/>
    </radialGradient>
  </defs>
</svg>
